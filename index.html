<!DOCTYPE html>
<html>
<head><title>New Contact Form Submission</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #0a0a0f; color: #fff;">
  <div style="background: #161625; padding: 30px; border-radius: 12px; border-left: 4px solid #f97316;">
    <h2 style="color: #f97316; margin-top: 0;">🔔 New Contact Form Submission</h2>
    <p style="color: #a1a1aa;">A user has filled the contact form on your website.</p>
    <hr style="border-color: rgba(255,255,255,0.05);">
    <div style="margin: 20px 0;">
      <p><strong style="color: #f97316;">👤 Name:</strong> <span style="color: #f4f4f5; font-size: 18px;">{{from_name}}</span></p>
      <p><strong style="color: #f97316;">📧 Email:</strong> <span style="color: #f4f4f5;">{{from_email}}</span></p>
      <p><strong style="color: #f97316;">📱 Phone:</strong> <span style="color: #f4f4f5;">{{phone}}</span></p>
      <p><strong style="color: #f97316;">💬 Message:</strong></p>
      <div style="background: #0a0a0f; padding: 15px; border-radius: 8px; color: #b0b0c8; border: 1px solid rgba(255,255,255,0.05);">{{message}}</div>
    </div>
    <hr style="border-color: rgba(255,255,255,0.05);">
    <p style="color: #7878a0; font-size: 12px; text-align: center;">📍 AYFRONEX - Transform Your Brand<br>⏱️ {{submitted_at}}</p>
  </div>
</body>
</html>
